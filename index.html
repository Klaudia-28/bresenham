<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!--título de la pestaña-->
    <title>Algoritmo Bresenham</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
      }

      /*color título*/
      h1 {
        color: #490b75;
      }

      /*color subtítulos*/
      h3,
      th {
        color: #b674d1;
      }

      /*inputs de coordenadas*/
      input[type="number"] {
        border: 2px solid #9f40c4;
        padding: 4px;
      }

      /*cuando el usuario hace clic*/
      input[type="number"]:focus {
        outline: none;
        border-color: #a776bb;
      }

      /*botones*/
      button {
        background-color: #e6ccff;
        border: 1px solid #b57edc;
        padding: 5px 10px;
        cursor: pointer;
      }

      button:hover {
        background-color: #a46cdc;
      }

      /*color del canvas*/
      canvas {
        border: 2px solid #b674d1;
        background-color: #c6efc6;
      }

      /*color de la tabla*/
      #tabla {
        background-color: #d5f6d5;
      }

      table {
        border-collapse: collapse;
      }

      th {
        background-color: #f3e6ff;
      }

      td,
      th {
        padding: 4px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <font face="Segoe UI, Arial, sans-serif">
      <!--título de la aplicación-->
      <h1 align="center">Dibujo de línea</h1>
      <!--explicación del programa-->
      <p align="center"> Dibujo de una línea usando el algoritmo de Bresenham </p>
      <!--ingreso de los datos-->
      <h3 align="center">Ingrese las coordenadas</h3>
      <!--tabla con dato y valor-->
      <center>
        <table>
          <tr>
            <th>Dato</th>
            <th>Valor</th>
          </tr>
          <!--COORDENADAS-->
          <!--x0-->
          <tr>
            <td>X0</td>
            <!--value= valor por defecto que ve el usuario-->
            <td>
              <input type="number" id="x0" value="10">
            </td>
          </tr>
          <!--x1-->
          <tr>
            <td>Y0</td>
            <td>
              <input type="number" id="y0" value="10">
            </td>
          </tr>
          <!--y0-->
          <tr>
            <td>X1</td>
            <td>
              <input type="number" id="x1" value="100">
            </td>
          </tr>
          <!--y1-->
          <tr>
            <td>Y1</td>
            <td>
              <input type="number" id="y1" value="100">
            </td>
          </tr>
        </table>
      </center>
      <!--botones-->
      <p align="center">
        <button onclick="dibujarLinea()">Dibujar línea</button>
        <button onclick="limpiarCanvas()">Limpiar canvas</button>
      </p>
      <!--tabla con el canvas juntos-->
      <center>
        <table>
          <tr>
            <!--canvas-->
            <td valign="top">
              <canvas id="canvas" width="500" height="500" style="border:1px solid black;"></canvas>
            </td>
            <!--tabla-->
            <td valign="top">
              <div style="height:500px; overflow:auto;">
                <table id="tabla" border="1">
                  <tr>
                    <th>Paso</th>
                    <th>X</th>
                    <th>Y</th>
                    <th>Error</th>
                  </tr>
                </table>
              </div>
            </td>
          </tr>
        </table>
        <script src="index.js"></script>
  </body>
</html>
